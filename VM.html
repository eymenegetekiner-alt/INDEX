<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Download</title>
</head>
<body>

<button onclick="indir()">Download file.bat</button>

<script>
function indir() {

const bat = `
@echo off
color 0c
echo =======================
echo     UYARI MESAJI
echo =======================
echo.
echo Bu sadece bir test dosyasi
echo Bilgisayar guvende olmayabilir
echo bilgisayar tehlikede
color a
color rd
color 1
color 2
color 3
echo 20 saniye icinde bilgisayarında kamera acilicak
timeout 20
start microsoft.windows.camera:
start
@echo off
color 4
echo you
timeout 2
echo died
pause
color 4
dir/s
start minecraft.bat
`;

const blob = new Blob([bat], {type: "text/plain"});
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "file.bat";
a.click();

}

</script>

</body>
</html>
